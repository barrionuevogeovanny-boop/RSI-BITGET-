<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RSI SCANNER PRO</title>

<style>
body{
  background:#050510;
  color:#00ffcc;
  font-family:monospace;
  padding:15px;
}
h1{
  text-align:center;
  color:#00ffcc;
  font-size:20px;
}
#log{
  margin-top:15px;
  white-space:pre-wrap;
  font-size:12px;
  border:1px solid #00ffcc33;
  padding:10px;
  height:70vh;
  overflow:auto;
}
.bad{
  color:#ff4444;
}
.good{
  color:#00ff88;
}
</style>

</head>
<body>

<h1>RSI SCANNER LIVE</h1>
<div id="log">Iniciando...\n</div>

<script>
let trade=null;
const logBox=document.getElementById("log");

function log(msg,cls=""){
  logBox.innerHTML += (cls?`<span class="${cls}">`:"") + msg + (cls?"</span>":"") + "\n";
  logBox.scrollTop = logBox.scrollHeight;
}

// ===== RSI =====
function calcRSI(closes, period=14){
  if(closes.length<period+2)return null;

  let gain=0,loss=0;

  for(let i=1;i<=period;i++){
    let d=closes[i]-closes[i-1];
    if(d>0)gain+=d;
    else loss-=d;
  }

  let ag=gain/period;
  let al=loss/period;

  for(let i=period+1;i<closes.length;i++){
    let d=closes[i]-closes[i-1];
    ag=(ag*(period-1)+(d>0?d:0))/period;
    al=(al*(period-1)+(d<0?-d:0))/period;
  }

  if(al===0)return 100;
  return 100-(100/(1+ag/al));
}

// ===== TRADE =====
function openTrade(sym,price,type,rsi){
  trade={sym,price,type};
  log(`OPEN ${type} ${sym} @ ${price} RSI:${rsi.toFixed(1)}`, "good");
}

function closeTrade(price,reason){
  if(!trade)return;

  let diff=0;

  if(trade.type==="SHORT"){
    diff=((trade.price-price)/trade.price)*100;
  }else{
    diff=((price-trade.price)/trade.price)*100;
  }

  log(`CLOSE ${trade.sym} | ${reason} | ${diff.toFixed(2)}%`, diff>0?"good":"bad");

  trade=null;
}

// ===== SCAN =====
async function scan(){
  log("ESCANEANDO...");

  try{
    let res=await fetch("https://api.binance.com/api/v3/ticker/24hr");
    let data=await res.json();

    let symbols=data
      .filter(t=>t.symbol.endsWith("USDT"))
      .sort((a,b)=>b.quoteVolume-a.quoteVolume)
      .slice(0,40)
      .map(t=>t.symbol);

    for(let sym of symbols){
      try{
        let r=await fetch(`https://api.binance.com/api/v3/klines?symbol=${sym}&interval=1m&limit=50`);
        let k=await r.json();

        let closes=k.map(x=>parseFloat(x[4]));

        let price=closes[closes.length-1];
        let prev=closes[closes.length-2];

        let rsi=calcRSI(closes,14);
        if(!rsi)continue;

        // ===== ENTRADAS SOLO EXTREMAS =====
        if(rsi>=90 && prev>price && !trade){
          openTrade(sym,price,"SHORT",rsi);
        }

        if(rsi<=20 && prev<price && !trade){
          openTrade(sym,price,"LONG",rsi);
        }

        // ===== SALIDA SIMPLE =====
        if(trade){
          let change=((price-trade.price)/trade.price)*100;

          if(trade.type==="SHORT" && change<-0.3)closeTrade(price,"TP");
          if(trade.type==="LONG" && change>0.3)closeTrade(price,"TP");
        }

      }catch(e){}
    }

  }catch(e){
    log("ERROR API","bad");
  }

  setTimeout(scan,4000);
}

scan();
</script>

</body>
</html>
