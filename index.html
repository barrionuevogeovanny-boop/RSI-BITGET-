<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSI Scanner - Bitget</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0a0a1f; color: #fff; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #00ffaa; }
    .subtitle { text-align: center; color: #aaa; margin-bottom: 20px; }
    .controls { text-align: center; margin-bottom: 10px; }
    .controls label { color: #aaa; margin-right: 6px; font-size: 14px; }
    .controls select { background: #1a1a2e; color: #fff; border: 1px solid #333; border-radius: 6px; padding: 5px 10px; font-size: 14px; margin-right: 14px; }
    button { display: block; margin: 15px auto; padding: 12px 30px; font-size: 17px; background: #00ffaa; color: black; border: none; border-radius: 8px; cursor: pointer; }
    button:disabled { background: #007755; color: #aaa; cursor: not-allowed; }
    .progress { max-width: 600px; margin: 0 auto 10px; }
    .progress-bar { height: 6px; background: #1a1a2e; border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 6px; background: #00ffaa; border-radius: 3px; transition: width 0.2s; width: 0%; }
    .progress-text { text-align: center; color: #aaa; font-size: 13px; margin-bottom: 5px; }
    .signals { max-width: 1100px; margin: 20px auto; }
    .signal-card { padding: 15px; margin: 10px 0; border-radius: 8px; font-weight: bold; font-size: 17px; }
    .strong-sell { background: #8B0000; }
    .strong-buy { background: #006400; }
    table { width: 100%; max-width: 1100px; margin: 0 auto; border-collapse: collapse; background: #1a1a2e; }
    th, td { padding: 14px; text-align: center; border-bottom: 1px solid #333; }
    th { background: #16213e; color: #00ffaa; }
    .oversold { background: #004d00 !important; color: #00ff88; }
    .overbought { background: #660000 !important; color: #ff7777; }
    .last-update { text-align: center; color: #888; margin: 15px 0; font-size: 13px; }
    .error-cell { color: #ffaaaa; }
  </style>
</head>
<body>
  <h1>🔍 RSI Scanner - Cripto</h1>
  <p class="subtitle" id="subtitleTf">Precios reales • RSI real calculado • 15 minutos</p>

  <div class="controls">
    <label>Periodo RSI:</label>
    <select id="rsiPeriod">
      <option value="14" selected>14 (default)</option>
      <option value="9">9 (rápido)</option>
      <option value="21">21 (lento)</option>
    </select>
    <label>Timeframe:</label>
    <select id="tfSelect">
      <option value="15m" selected>15 min</option>
      <option value="1h">1 hora</option>
      <option value="4h">4 horas</option>
      <option value="1d">1 día</option>
    </select>
  </div>

  <button id="mainBtn" onclick="cargarDatos()">🔄 Actualizar Datos Reales</button>

  <div class="progress" id="progressArea" style="display:none">
    <div class="progress-text" id="progressText">Cargando...</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="signals" id="strongSignals"></div>
  <div class="last-update" id="lastUpdate"></div>

  <table>
    <thead>
      <tr>
        <th>Token</th>
        <th>Precio Actual</th>
        <th>RSI</th>
        <th>Señal</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <script>
    const tokens = [
      "BTCUSDT","ETHUSDT","SOLUSDT","DOGEUSDT","XRPUSDT","BNBUSDT","ADAUSDT","AVAXUSDT",
      "TONUSDT","SHIBUSDT","LINKUSDT","DOTUSDT","NEARUSDT","SUIUSDT","OPUSDT",
      "ARBUSDT","INJUSDT","APTUSDT","ATOMUSDT","UNIUSDT","LTCUSDT",
      "FETUSDT","RENDERUSDT","STXUSDT","AAVEUSDT","PEPEUSDT","WLDUSDT"
    ];

    const tfLabels = { '15m':'15 minutos','1h':'1 hora','4h':'4 horas','1d':'1 día' };

    async function fetchKlines(symbol, interval, limit) {
      const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`;
      const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      return data.map(c => parseFloat(c[4]));
    }

    function calcRSI(closes, period) {
      if (closes.length < period + 2) return null;
      let g = 0, l = 0;
      for (let i = 1; i <= period; i++) {
        const d = closes[i] - closes[i-1];
        if (d > 0) g += d; else l -= d;
      }
      let ag = g / period, al = l / period;
      for (let i = period + 1; i < closes.length; i++) {
        const d = closes[i] - closes[i-1];
        ag = (ag * (period-1) + (d > 0 ? d : 0)) / period;
        al = (al * (period-1) + (d < 0 ? -d : 0)) / period;
      }
      if (al === 0) return 100;
      return 100 - 100 / (1 + ag / al);
    }

    async function cargarDatos() {
      const period = parseInt(document.getElementById('rsiPeriod').value);
      const tf = document.getElementById('tfSelect').value;
      const btn = document.getElementById('mainBtn');

      document.getElementById('subtitleTf').textContent =
        `Precios reales • RSI real calculado • ${tfLabels[tf]}`;
      btn.disabled = true;
      btn.textContent = '⏳ Escaneando...';

      const tbody = document.getElementById('tableBody');
      const signalsDiv = document.getElementById('strongSignals');
      tbody.innerHTML = '';
      signalsDiv.innerHTML = '';
      document.getElementById('lastUpdate').textContent = '';
      document.getElementById('progressArea').style.display = 'block';
      document.getElementById('progressFill').style.width = '0%';

      const limit = period + 50;
      let done = 0, strong = [], errors = 0;
      const rows = {};

      for (let i = 0; i < tokens.length; i += 5) {
        const batch = tokens.slice(i, i + 5);

        await Promise.all(batch.map(async symbol => {
          try {
            const closes = await fetchKlines(symbol, tf, limit);
            if (!closes || closes.length < period + 2) throw new Error('pocas velas');
            const rsiRaw = calcRSI(closes, period);
            if (rsiRaw === null) throw new Error('rsi null');
            const rsi = Math.round(rsiRaw * 10) / 10;
            const lastPrice = closes[closes.length - 1];
            const price = lastPrice >= 1
              ? lastPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 4 })
              : lastPrice.toFixed(6);

            let clase = '', señal = 'Neutral';
            if (rsi <= 20) {
              clase = 'oversold'; señal = '🟢 MUY SOBREVENDIDO';
              strong.push({ rsi, type: 'buy', html: `<div class="signal-card strong-buy">${symbol} → RSI ${rsi} → 🟢 MUY SOBREVENDIDO (Posible Compra Fuerte)</div>` });
            } else if (rsi >= 80) {
              clase = 'overbought'; señal = '🔴 MUY SOBRECOMPRADO';
              strong.push({ rsi, type: 'sell', html: `<div class="signal-card strong-sell">${symbol} → RSI ${rsi} → 🔴 MUY SOBRECOMPRADO (Posible Venta Fuerte)</div>` });
            } else if (rsi <= 30) {
              clase = 'oversold'; señal = '🟢 Posible Compra';
            } else if (rsi >= 70) {
              clase = 'overbought'; señal = '🔴 Posible Venta';
            }
            rows[symbol] = `<tr class="${clase}"><td><strong>${symbol}</strong></td><td>$${price}</td><td><strong>${rsi}</strong></td><td>${señal}</td></tr>`;
          } catch (e) {
            errors++;
            rows[symbol] = `<tr><td><strong>${symbol}</strong></td><td class="error-cell">Error</td><td>-</td><td class="error-cell">Sin datos</td></tr>`;
          }
          done++;
          document.getElementById('progressFill').style.width = Math.round(done / tokens.length * 100) + '%';
          document.getElementById('progressText').textContent = `Escaneando ${done}/${tokens.length} pares...`;
        }));

        await new Promise(r => setTimeout(r, 80));
      }

      tokens.forEach(sym => { if (rows[sym]) tbody.innerHTML += rows[sym]; });
      document.getElementById('progressArea').style.display = 'none';

      const buys = strong.filter(s => s.type === 'buy').sort((a,b) => a.rsi - b.rsi);
      const sells = strong.filter(s => s.type === 'sell').sort((a,b) => b.rsi - a.rsi);
      signalsDiv.innerHTML = [...buys, ...sells].map(s => s.html).join('') ||
        `<p style="color:#555;text-align:center;">No hay señales extremas (RSI ≤20 o ≥80) en este momento</p>`;

      document.getElementById('lastUpdate').textContent =
        `Última actualización: ${new Date().toLocaleTimeString('es-ES')} • RSI(${period}) en ${tfLabels[tf]}` +
        (errors > 0 ? ` • ${errors} pares fallaron` : '');

      btn.disabled = false;
      btn.textContent = '🔄 Actualizar Datos Reales';
    }

    window.onload = cargarDatos;
    setInterval(cargarDatos, 60000);
  </script>
</body>
</html>
