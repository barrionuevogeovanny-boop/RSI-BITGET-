<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>RSI Scanner — Cripto</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Courier New', monospace;
      background: #050510;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }
    #canvas-bg {
      position: fixed; top:0; left:0;
      width:100%; height:100%;
      z-index:0; pointer-events:none;
    }
    #app {
      position: relative; z-index:1;
      max-width: 900px;
      margin: 0 auto;
      padding: 16px 14px 80px;
    }

    /* HEADER */
    .header { text-align:center; margin-bottom: 14px; }
    h1 {
      font-size: 26px; font-weight: 900;
      letter-spacing: 5px; text-transform: uppercase;
      color: #00ffcc;
      text-shadow: 0 0 20px #00ffcc88, 0 0 40px #00ffcc33;
      margin-bottom: 3px;
    }
    .sub {
      color: #00ffcc77; font-size: 10px;
      text-transform: uppercase; letter-spacing: 2px;
    }

    /* TABS — barra inferior fija tipo app móvil */
    .tabs {
      position: fixed; bottom: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      background: rgba(3,3,15,0.97);
      border-top: 1px solid #00ffcc22;
      backdrop-filter: blur(12px);
    }
    .tab {
      flex: 1; padding: 10px 4px 12px;
      text-align: center; cursor: pointer;
      font-size: 9px; font-weight: 900;
      text-transform: uppercase; letter-spacing: 1px;
      color: #00ffcc44;
      transition: all 0.2s;
      border: none; background: none;
    }
    .tab .tab-icon { font-size: 18px; display: block; margin-bottom: 2px; }
    .tab.active { color: #00ffcc; border-top: 2px solid #00ffcc; }
    .tab.active .tab-icon { filter: drop-shadow(0 0 4px #00ffcc); }

    /* PAGES */
    .page { display: none; }
    .page.active { display: block; }

    /* CONTROLES */
    .ctrl {
      background: rgba(0,20,20,0.75);
      border: 1px solid #00aaff22;
      border-radius: 12px; padding: 12px 14px;
      margin-bottom: 10px;
      backdrop-filter: blur(10px);
    }
    .ctrl-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px 10px;
    }
    .ctrl-item { display: flex; flex-direction: column; gap: 4px; }
    .ctrl-item label {
      color: #00aaff; font-size: 9px; font-weight: 900;
      text-transform: uppercase; letter-spacing: 1px;
    }
    .ctrl-item.lbl-green label { color: #00ffcc; }
    .ctrl-item.lbl-yellow label { color: #ffcc00; }
    .ctrl-item.lbl-red label { color: #ff6644; }
    .ctrl-item select {
      background: #020215; color: #00aaff;
      border: 1px solid #00aaff44; border-radius: 6px;
      padding: 5px 6px; font-size: 11px;
      font-family: 'Courier New', monospace;
      width: 100%;
    }
    .ctrl-item.lbl-green select { color: #00ffcc; border-color: #00ffcc33; }
    .ctrl-item.lbl-yellow select { color: #ffcc00; border-color: #ffcc0033; }
    .ctrl-item.lbl-red select { color: #ff6644; border-color: #ff664433; }

    /* SOUND BTN */
    .top-bar {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 8px; gap: 8px;
    }
    .sound-btn {
      background: rgba(0,170,255,0.08); color: #00aaff88;
      border: 1px solid #00aaff22; border-radius: 99px;
      padding: 5px 14px; font-size: 9px; font-weight: 900;
      font-family: 'Courier New', monospace;
      text-transform: uppercase; letter-spacing: 1px;
      cursor: pointer; white-space: nowrap;
    }
    .sound-btn.on { color: #00ffcc; border-color: #00ffcc55; background: rgba(0,255,204,0.10); }

    /* COUNTDOWN */
    .cd-wrap {
      flex: 1;
      background: rgba(0,255,180,0.05);
      border: 1px solid #00ffcc33;
      border-radius: 99px; padding: 5px 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .cd-label { font-size: 9px; color: #00ffcc88; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
    .cbar-bg { flex:1; height:3px; background:#00ffcc15; border-radius:2px; overflow:hidden; }
    .cbar-fill { height:3px; border-radius:2px; transition:width 1s linear; background:#00ffcc; box-shadow:0 0 4px #00ffcc; }
    .cd-num { font-size: 13px; font-weight: 900; color: #ffcc00; min-width: 30px; text-align:right; }

    /* PROGRESS */
    .prog { margin: 6px 0; }
    .prog-bar-bg { height: 3px; background:#00ffcc15; border-radius:2px; overflow:hidden; }
    .prog-bar-fill { height:3px; background: linear-gradient(90deg,#00ffcc,#00aaff); border-radius:2px; transition:width 0.2s; box-shadow:0 0 4px #00aaff; }
    .prog-txt { font-size: 9px; color:#ffcc00; text-align:center; margin-bottom: 4px; font-weight:900; text-transform:uppercase; letter-spacing:1px; }
    .pdot { display:inline-block; width:5px; height:5px; background:#ffcc00; border-radius:50%; margin-right:4px; animation:blink 1s infinite; }

    /* STATS */
    .stats { display:flex; gap:8px; margin: 8px 0; }
    .stat {
      flex:1; background:rgba(0,20,20,0.7);
      border:1px solid #00aaff22; border-radius:10px;
      padding:8px 6px; text-align:center;
    }
    .stat .n { font-size:22px; font-weight:900; }
    .stat .l { font-size:8px; color:#aaa; text-transform:uppercase; letter-spacing:1px; margin-top:1px; }
    .stat.blue .n { color:#00aaff; }
    .stat.red .n  { color:#ff4444; }
    .stat.green .n{ color:#00ff88; }

    /* SECTION TITLES */
    .sec-title {
      text-align:center; font-size:12px; font-weight:900;
      padding:10px 0 8px; letter-spacing:3px; text-transform:uppercase;
      display:flex; align-items:center; justify-content:center; gap:6px;
    }
    .sec-title.sell { color:#ff4444; text-shadow:0 0 10px #ff444477; }
    .sec-title.buy  { color:#00ff88; text-shadow:0 0 10px #00ff8877; }
    .dot { width:8px; height:8px; border-radius:50%; display:inline-block; animation:blink 1.2s infinite; }
    .dot.sell { background:#ff4444; box-shadow:0 0 6px #ff4444; }
    .dot.buy  { background:#00ff88; box-shadow:0 0 6px #00ff88; }
    @keyframes blink { 0%,100%{opacity:1}50%{opacity:0.3} }

    /* CARDS */
    .cards { display:flex; flex-direction:column; gap:7px; margin-bottom:14px; }
    .card { border-radius:8px; overflow:hidden; animation:fadeIn 0.4s ease; border-left:4px solid; }
    @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
    .card.sell { background:rgba(80,0,0,0.4); border-color:#ff4444; border-top:1px solid #66000088; border-right:1px solid #66000088; border-bottom:1px solid #66000088; }
    .card.buy  { background:rgba(0,60,35,0.4); border-color:#00ff88; border-top:1px solid #00443388; border-right:1px solid #00443388; border-bottom:1px solid #00443388; }
    .card-row { display:grid; grid-template-columns: 1fr auto; align-items:center; padding:8px 12px 3px; gap:6px; }
    .card-left { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .sym { font-size:15px; font-weight:900; text-transform:uppercase; letter-spacing:1px; color:#fff; white-space:nowrap; }
    .sym span { font-weight:400; color:#555; font-size:11px; }
    .badge { display:inline-flex; align-items:center; gap:3px; font-size:8px; font-weight:900; padding:2px 7px; border-radius:99px; text-transform:uppercase; letter-spacing:1px; white-space:nowrap; }
    .badge.sell { background:rgba(160,0,0,0.5); color:#ffaaaa; border:1px solid #ff444444; }
    .badge.buy  { background:rgba(0,100,50,0.5); color:#aaffcc; border:1px solid #00ff8844; }
    .card-right { display:flex; align-items:center; gap:12px; }
    .price { font-size:11px; color:#ccc; font-family:'Courier New',monospace; white-space:nowrap; }
    .rsi-n { font-size:24px; font-weight:900; line-height:1; font-family:'Courier New',monospace; }
    .card.sell .rsi-n { color:#ff4444; text-shadow:0 0 8px #ff444455; }
    .card.buy  .rsi-n { color:#00ff88; text-shadow:0 0 8px #00ff8855; }
    .rsi-lbl { font-size:8px; color:#aaa; text-transform:uppercase; letter-spacing:1px; text-align:right; }
    .spark-row { padding:0 12px 7px; height:38px; }
    .spark-row canvas { width:100%!important; height:38px!important; display:block; }

    /* EMPTY / LOG */
    .empty { text-align:center; padding:18px; color:#00aaff44; font-size:11px; font-weight:900; border:1px solid #00aaff22; border-radius:8px; text-transform:uppercase; letter-spacing:2px; background:rgba(0,20,20,0.5); margin-bottom:10px; }
    .logbox { background:rgba(0,10,10,0.85); border:1px solid #00ffcc11; border-radius:7px; padding:7px 10px; font-size:9px; color:#00ffcc55; max-height:45px; overflow-y:auto; white-space:pre-wrap; margin: 4px 0; }
    .update { text-align:center; color:#00ffcc33; font-size:9px; margin-top:6px; text-transform:uppercase; letter-spacing:1px; }

    /* ===== PÁGINA BUSCADOR ===== */
    .search-card {
      background: rgba(0,15,25,0.85);
      border: 1px solid #00aaff22;
      border-radius: 12px; padding: 14px;
      margin-bottom: 12px;
    }
    .search-card-title {
      font-size: 10px; font-weight:900; color:#00aaff;
      letter-spacing:3px; text-transform:uppercase; margin-bottom:10px;
    }
    .search-row { display:flex; gap:7px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
    .search-input {
      flex:1; min-width:80px;
      background:#020215; color:#00aaff;
      border:1px solid #00aaff33; border-radius:6px;
      padding:8px 10px; font-size:13px; font-weight:900;
      font-family:'Courier New',monospace; text-transform:uppercase;
      outline:none; letter-spacing:1px;
    }
    .search-input:focus { border-color:#00aaff88; box-shadow:0 0 6px #00aaff22; }
    .search-btn {
      background:rgba(0,170,255,0.12); color:#00aaff;
      border:1px solid #00aaff44; border-radius:6px;
      padding:8px 16px; font-size:10px; font-weight:900;
      font-family:'Courier New',monospace; text-transform:uppercase;
      letter-spacing:1px; cursor:pointer;
    }
    .watch-btn-2 {
      background:rgba(255,100,0,0.12); color:#ff6600;
      border:1px solid #ff660044; border-radius:6px;
      padding:8px 14px; font-size:10px; font-weight:900;
      font-family:'Courier New',monospace; text-transform:uppercase;
      letter-spacing:1px; cursor:pointer; display:none;
    }
    .watch-btn-2.active { background:rgba(255,100,0,0.3); color:#ffaa00; border-color:#ffaa0077; animation:wPulse 1.5s infinite; }
    @keyframes wPulse { 0%,100%{box-shadow:0 0 6px #ff660044}50%{box-shadow:0 0 14px #ff6600aa} }

    .sr-result { display:none; }
    .sr-top { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:8px; gap:8px; }
    .sr-sym { font-size:18px; font-weight:900; color:#fff; letter-spacing:1px; }
    .sr-price { font-size:11px; margin-top:2px; font-family:'Courier New',monospace; }
    .sr-info-txt { font-size:9px; color:#00aaff88; text-transform:uppercase; letter-spacing:1px; margin-top:2px; }
    .sr-rsi-box { text-align:right; }
    .sr-rsi { font-size:30px; font-weight:900; font-family:'Courier New',monospace; }
    .sr-rsi.high { color:#ff4444; text-shadow:0 0 10px #ff444455; }
    .sr-rsi.low  { color:#00ff88; text-shadow:0 0 10px #00ff8855; }
    .sr-rsi.mid  { color:#ffcc00; }
    .sr-rsi-lbl { font-size:8px; color:#aaa; letter-spacing:1px; }
    .sr-bars { display:flex; gap:10px; margin-bottom:8px; }
    .sr-bar-w { flex:1; }
    .sr-bar-lbl { font-size:8px; color:#aaa; text-transform:uppercase; letter-spacing:1px; margin-bottom:3px; }
    .sr-bar-bg { height:5px; background:#ffffff0a; border-radius:3px; overflow:hidden; }
    .sr-bar-fill { height:5px; border-radius:3px; transition:width 0.5s; }
    .sr-spark { height:55px; }
    .sr-spark canvas { width:100%!important; height:55px!important; display:block; }

    .watch-status { font-size:9px; color:#ff660077; text-transform:uppercase; letter-spacing:1px; margin-top:6px; min-height:13px; }
    .watch-status.on { color:#ffaa00; }
    .watch-alert-box {
      display:none; margin-top:8px;
      background:rgba(255,100,0,0.18); border:1px solid #ff660077;
      border-radius:8px; padding:10px; text-align:center;
      font-size:12px; font-weight:900; color:#ffaa00;
      text-transform:uppercase; letter-spacing:2px;
      animation:wPulse 0.8s infinite;
    }
    .search-err { color:#ff444477; font-size:10px; text-transform:uppercase; letter-spacing:1px; padding:4px 0; min-height:16px; }

    /* MOBILE */
    @media (max-width: 600px) {
      h1 { font-size: 20px; letter-spacing: 3px; }
      .sub { font-size: 9px; }
      .ctrl-grid { grid-template-columns: repeat(2, 1fr); gap:6px; }
      .ctrl { padding: 10px; }
      .stat .n { font-size: 18px; }
      .stat .l { font-size: 7px; }
      .sym { font-size: 13px; }
      .rsi-n { font-size: 20px; }
      .badge { font-size: 7px; }
      .spark-row { height:32px; }
      .spark-row canvas { height:32px!important; }
      .sec-title { font-size: 10px; letter-spacing: 2px; }
      .sr-sym { font-size: 15px; }
      .sr-rsi { font-size: 24px; }
    }
  </style>
</head>
<body>
<canvas id="canvas-bg"></canvas>
<div id="app">

  <div class="header">
    <h1 id="mainTitle">RSI SCANNER</h1>
    <p class="sub" id="subTxt">CRIPTO · SEÑALES RSI EXTREMAS · TIEMPO REAL</p>
  </div>

  <!-- ===================== PAGE: SCANNER ===================== -->
  <div class="page active" id="pageScanner">

    <div class="ctrl">
      <div class="ctrl-grid">
        <div class="ctrl-item">
          <label>Timeframe</label>
          <select id="tf">
            <option value="1h" selected>1 HORA</option>
            <option value="15m">15 MIN</option>
            <option value="4h">4 HORAS</option>
            <option value="1d">1 DIA</option>
          </select>
        </div>
        <div class="ctrl-item">
          <label>Vol Minimo</label>
          <select id="volMin">
            <option value="1">$1M</option>
            <option value="3" selected>$3M</option>
            <option value="5">$5M</option>
            <option value="10">$10M</option>
          </select>
        </div>
        <div class="ctrl-item lbl-yellow">
          <label>RSI Venta &ge;</label>
          <select id="maxRsi">
            <option value="70">70</option>
            <option value="75">75</option>
            <option value="80">80</option>
            <option value="85">85</option>
            <option value="90" selected>90</option>
          </select>
        </div>
        <div class="ctrl-item lbl-green">
          <label>RSI Compra &le;</label>
          <select id="minRsi">
            <option value="35">35</option>
            <option value="30">30</option>
            <option value="25">25</option>
            <option value="20" selected>20</option>
            <option value="15">15</option>
            <option value="10">10</option>
          </select>
        </div>
      </div>
    </div>

    <div class="top-bar">
      <button class="sound-btn on" id="btnSound" onclick="toggleSound()">🔔 SONIDO ON</button>
      <div class="cd-wrap">
        <span class="cd-label">SIGUIENTE:</span>
        <div class="cbar-bg"><div class="cbar-fill" id="cbarFill" style="width:100%"></div></div>
        <span class="cd-num" id="cdNum">--</span>
      </div>
    </div>

    <div id="progArea" style="display:none" class="prog">
      <div class="prog-txt" id="progTxt"><span class="pdot"></span>INICIANDO...</div>
      <div class="prog-bar-bg"><div class="prog-bar-fill" id="progFill" style="width:0%"></div></div>
    </div>
    <div class="logbox" id="logbox" style="display:none"></div>

    <div id="statsArea" style="display:none" class="stats">
      <div class="stat blue"><div class="n" id="nScanned">0</div><div class="l">ESCANEADOS</div></div>
      <div class="stat red"><div class="n" id="nSell">0</div><div class="l">&#9679; VENTA</div></div>
      <div class="stat green"><div class="n" id="nBuy">0</div><div class="l">&#9679; COMPRA</div></div>
    </div>

    <div id="sellSection" style="display:none">
      <div class="sec-title sell"><span class="dot sell"></span>SOBRECOMPRADOS — SHORT</div>
      <div class="cards" id="sellCards"></div>
    </div>
    <div id="buySection" style="display:none">
      <div class="sec-title buy"><span class="dot buy"></span>SOBREVENDIDOS — LONG</div>
      <div class="cards" id="buyCards"></div>
    </div>
    <div id="emptyMsg" style="display:none" class="empty">SIN SEÑALES · ESPERANDO PRÓXIMO ESCANEO</div>
    <div class="update" id="updateTxt"></div>
  </div>

  <!-- ===================== PAGE: BUSCADOR ===================== -->
  <div class="page" id="pageBuscador">

    <div class="search-card">
      <div class="search-card-title">&#9740; BUSCADOR CRIPTO UNIVERSAL</div>
      <div class="search-row">
        <input class="search-input" id="searchSym" type="text" placeholder="BTC, ETH, PEPE..." maxlength="20" />
        <button class="search-btn" onclick="searchToken()">&#9654; BUSCAR</button>
        <button class="watch-btn-2" id="watchBtn" onclick="toggleWatch()">&#128065; WATCH</button>
      </div>
      <div class="search-err" id="searchErr"></div>

      <div class="sr-result" id="searchResult">
        <div class="sr-top">
          <div>
            <div class="sr-sym" id="srSym">--</div>
            <div class="sr-price" id="srPrice">--</div>
            <div class="sr-info-txt" id="srInfo">--</div>
          </div>
          <div class="sr-rsi-box">
            <div class="sr-rsi mid" id="srRsi">--</div>
            <div class="sr-rsi-lbl">RSI 14</div>
          </div>
        </div>
        <div class="sr-bars">
          <div class="sr-bar-w">
            <div class="sr-bar-lbl">RSI</div>
            <div class="sr-bar-bg"><div class="sr-bar-fill" id="srRsiBar" style="width:0%;background:#ffcc00"></div></div>
          </div>
          <div class="sr-bar-w">
            <div class="sr-bar-lbl">CAMBIO 24H</div>
            <div class="sr-bar-bg"><div class="sr-bar-fill" id="srChgBar" style="width:50%;background:#00ff88"></div></div>
          </div>
        </div>
        <div class="sr-spark"><canvas id="srCanvas"></canvas></div>
        <div class="watch-status" id="watchStatus"></div>
        <div class="watch-alert-box" id="watchAlert">🚨 RSI 85 ALCANZADO!</div>
      </div>
    </div>

  </div>

</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab active" id="tab0" onclick="showPage(0)">
    <span class="tab-icon">📡</span>SCANNER
  </button>
  <button class="tab" id="tab1" onclick="showPage(1)">
    <span class="tab-icon">🔍</span>BUSCADOR
  </button>
</div>

<!-- GALAXIA 3D -->
<script>
(function(){
  var cv=document.getElementById('canvas-bg');
  var cx=cv.getContext('2d');
  var W,H,stars=[],nebulae=[],angle=0;
  var COLORS=['#ffffff','#aaddff','#ffddaa','#ffaaaa','#aaffdd','#ddaaff','#ffffff','#ffffff'];
  function build(){
    stars=[];nebulae=[];
    for(var i=0;i<1400;i++){
      var r=Math.pow(Math.random(),0.5)*500;
      var arm=Math.floor(Math.random()*3);
      var armA=arm*(Math.PI*2/3);
      var spiral=r*0.012;
      var scatter=Math.random()*0.5-0.25;
      var theta=r>80?armA+spiral+scatter:Math.random()*Math.PI*2;
      var phi=Math.acos(2*Math.random()-1);
      stars.push({x:r*Math.sin(phi)*Math.cos(theta),y:r*Math.sin(phi)*Math.sin(theta)*0.28,z:r*Math.cos(phi)*0.28,size:Math.random()*1.5+0.3,color:COLORS[Math.floor(Math.random()*COLORS.length)],twinkle:Math.random()*Math.PI*2,twinkleSpeed:0.02+Math.random()*0.04,brightness:0.5+Math.random()*0.5});
    }
    for(var j=0;j<5;j++) nebulae.push({x:(Math.random()-0.5)*300,y:(Math.random()-0.5)*70,z:(Math.random()-0.5)*70,r:45+Math.random()*65,color:['rgba(0,60,140,','rgba(70,0,110,','rgba(0,90,70,'][Math.floor(Math.random()*3)],alpha:0.025+Math.random()*0.03});
  }
  function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;build();}
  window.addEventListener('resize',resize);resize();
  function draw(){
    angle+=0.0005;
    cx.fillStyle='rgba(3,3,12,0.22)';cx.fillRect(0,0,W,H);
    var cosA=Math.cos(angle),sinA=Math.sin(angle),CX=W/2,CY=H/2,FL=650;
    nebulae.forEach(function(n){
      var rx=n.x*cosA+n.z*sinA,ry=n.y,rz=-n.x*sinA+n.z*cosA;
      if(rz<-FL*0.8)return;
      var sc=FL/(FL+rz+300),sx=CX+rx*sc,sy=CY+ry*sc;
      var g=cx.createRadialGradient(sx,sy,0,sx,sy,n.r*sc*2.2);
      g.addColorStop(0,n.color+n.alpha+')');g.addColorStop(1,n.color+'0)');
      cx.beginPath();cx.arc(sx,sy,n.r*sc*2.2,0,Math.PI*2);cx.fillStyle=g;cx.fill();
    });
    stars.forEach(function(s){
      s.twinkle+=s.twinkleSpeed;
      var rx=s.x*cosA+s.z*sinA,ry=s.y,rz=-s.x*sinA+s.z*cosA;
      if(rz<-FL*0.9)return;
      var sc=FL/(FL+rz+300),sx=CX+rx*sc,sy=CY+ry*sc;
      if(sx<-10||sx>W+10||sy<-10||sy>H+10)return;
      var tw=0.75+0.25*Math.sin(s.twinkle);
      var sz=Math.max(0.3,s.size*sc*tw);
      var alpha=Math.min(1,(0.3+rz/600)*s.brightness*tw);
      if(alpha<=0)return;
      cx.beginPath();cx.arc(sx,sy,sz,0,Math.PI*2);
      cx.fillStyle=s.color;cx.globalAlpha=alpha;cx.fill();
      if(sz>1.0&&alpha>0.55){cx.beginPath();cx.arc(sx,sy,sz*2.8,0,Math.PI*2);cx.fillStyle=s.color;cx.globalAlpha=alpha*0.07;cx.fill();}
      cx.globalAlpha=1;
    });
    var cg=cx.createRadialGradient(CX,CY,0,CX,CY,55);
    cg.addColorStop(0,'rgba(180,210,255,0.2)');cg.addColorStop(0.4,'rgba(120,160,255,0.06)');cg.addColorStop(1,'rgba(0,0,0,0)');
    cx.beginPath();cx.arc(CX,CY,55,0,Math.PI*2);cx.fillStyle=cg;cx.fill();
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>

// ============================================================
// RSI
// ============================================================
function calcRSI(closes,period){
  if(closes.length<period+2)return null;
  var g=0,l=0,i,d;
  for(i=1;i<=period;i++){d=closes[i]-closes[i-1];if(d>0)g+=d;else l-=d;}
  var ag=g/period,al=l/period;
  for(i=period+1;i<closes.length;i++){d=closes[i]-closes[i-1];ag=(ag*(period-1)+(d>0?d:0))/period;al=(al*(period-1)+(d<0?-d:0))/period;}
  if(al===0)return 100;
  return 100-100/(1+ag/al);
}
function calcRSIArray(closes,period){
  var out=[];
  for(var end=period+2;end<=closes.length;end++){var r=calcRSI(closes.slice(0,end),period);if(r!==null)out.push(r);}
  return out.slice(-50);
}

// ============================================================
// SPARKLINE
// ============================================================
function drawSparkline(cvs,rsiVals,type){
  var W=cvs.offsetWidth||800,H=cvs.offsetHeight||38;
  cvs.width=W;cvs.height=H;
  var ctx=cvs.getContext('2d');ctx.clearRect(0,0,W,H);
  if(!rsiVals||rsiVals.length<2)return;
  var color=type==='sell'?'#ff4444':'#00ff88';
  var toY=function(v){return H-(v/100)*H;};
  var step=W/(rsiVals.length-1);
  ctx.fillStyle='rgba(255,68,68,0.05)';ctx.fillRect(0,0,W,toY(70));
  ctx.fillStyle='rgba(0,255,136,0.05)';ctx.fillRect(0,toY(30),W,H-toY(30));
  [[70,'70'],[50,'50'],[30,'30']].forEach(function(p){
    var y=toY(p[0]);ctx.beginPath();ctx.setLineDash([3,6]);ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=0.7;ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,255,255,0.2)';ctx.font='7px Courier New';ctx.fillText(p[1],3,y-2);
  });
  ctx.beginPath();ctx.moveTo(0,H);rsiVals.forEach(function(v,i){ctx.lineTo(i*step,toY(v));});ctx.lineTo((rsiVals.length-1)*step,H);ctx.closePath();ctx.fillStyle=color+'12';ctx.fill();
  ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.shadowColor=color;ctx.shadowBlur=4;
  rsiVals.forEach(function(v,i){if(i===0)ctx.moveTo(0,toY(v));else ctx.lineTo(i*step,toY(v));});
  ctx.stroke();ctx.shadowBlur=0;
  var last=rsiVals[rsiVals.length-1];
  ctx.beginPath();ctx.arc((rsiVals.length-1)*step,toY(last),3,0,Math.PI*2);ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=6;ctx.fill();ctx.shadowBlur=0;
}

function drawSearchSparkline(cvs,rsiVals){
  var W=cvs.offsetWidth||860,H=55;
  cvs.width=W;cvs.height=H;
  var ctx=cvs.getContext('2d');ctx.clearRect(0,0,W,H);
  if(!rsiVals||rsiVals.length<2)return;
  var lastRsi=rsiVals[rsiVals.length-1];
  var color=lastRsi>=70?'#ff4444':(lastRsi<=30?'#00ff88':'#00aaff');
  var toY=function(v){return H-(v/100)*H;};
  var step=W/(rsiVals.length-1);
  ctx.fillStyle='rgba(255,68,68,0.06)';ctx.fillRect(0,0,W,toY(70));
  ctx.fillStyle='rgba(0,255,136,0.06)';ctx.fillRect(0,toY(30),W,H-toY(30));
  [[90,'90','rgba(255,68,68,0.5)'],[70,'70','rgba(255,255,255,0.12)'],[50,'50','rgba(255,255,255,0.08)'],[30,'30','rgba(255,255,255,0.12)'],[10,'10','rgba(0,255,136,0.5)']].forEach(function(t){
    var y=toY(t[0]);ctx.beginPath();ctx.setLineDash([3,7]);ctx.strokeStyle=t[2];ctx.lineWidth=0.8;ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,255,255,0.25)';ctx.font='8px Courier New';ctx.fillText(t[1],3,y-2);
  });
  ctx.beginPath();ctx.moveTo(0,H);rsiVals.forEach(function(v,i){ctx.lineTo(i*step,toY(v));});ctx.lineTo((rsiVals.length-1)*step,H);ctx.closePath();ctx.fillStyle=color+'18';ctx.fill();
  ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=1.8;ctx.shadowColor=color;ctx.shadowBlur=5;
  rsiVals.forEach(function(v,i){if(i===0)ctx.moveTo(0,toY(v));else ctx.lineTo(i*step,toY(v));});
  ctx.stroke();ctx.shadowBlur=0;
  var last=rsiVals[rsiVals.length-1];
  ctx.beginPath();ctx.arc((rsiVals.length-1)*step,toY(last),4,0,Math.PI*2);ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=8;ctx.fill();ctx.shadowBlur=0;
}

function rsiLabel(rsi,type){

// SCANNER
// ============================================================
var running=false,cdTimer=null,CD=25;

function startCD(sec){
  if(cdTimer)clearInterval(cdTimer);
  var v=sec;
  var num=document.getElementById('cdNum'),fill=document.getElementById('cbarFill');
  num.textContent=v+'S';fill.style.width='100%';
  cdTimer=setInterval(function(){
    v--;num.textContent=v+'S';fill.style.width=Math.round(v/sec*100)+'%';
    if(v<=0){clearInterval(cdTimer);num.textContent='';scan();}
  },1000);
}

async function scan(){
  if(running)return;running=true;
  if(cdTimer)clearInterval(cdTimer);
  var tf=document.getElementById('tf').value;
  var maxRsi=parseInt(document.getElementById('maxRsi').value);
  var minRsi=parseInt(document.getElementById('minRsi').value);
  var volMin=parseFloat(document.getElementById('volMin').value)*1e6;
  var tfLabel={'15m':'15M','1h':'1H','4h':'4H','1d':'1D'}[tf];

  document.getElementById('subTxt').textContent='RSI >='+maxRsi+' VENTA / <='+minRsi+' COMPRA · '+tfLabel;
  document.getElementById('progArea').style.display='block';
  document.getElementById('statsArea').style.display='none';
  document.getElementById('sellSection').style.display='none';
  document.getElementById('buySection').style.display='none';
  document.getElementById('emptyMsg').style.display='none';
  document.getElementById('logbox').textContent='';
  document.getElementById('logbox').style.display='block';
  document.getElementById('progFill').style.width='0%';
  document.getElementById('cdNum').textContent='...';

  addLog('INICIANDO ESCANEO...');
  var symbols=[];
  try{
    var res=await fetch('https://data-api.binance.vision/api/v3/ticker/24hr',{mode:'cors'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    var data=await res.json();
    symbols=data.filter(function(t){return t.symbol.endsWith('USDT')&&parseFloat(t.quoteVolume)>volMin;})
      .sort(function(a,b){return parseFloat(b.quoteVolume)-parseFloat(a.quoteVolume);})
      .map(function(t){return t.symbol;});
    addLog(symbols.length+' PARES');
  }catch(e){addLog('ERROR: '+e.message);running=false;startCD(CD);return;}

  var done=0,sellSigs=[],buySigs=[],errors=0;
  for(var i=0;i<symbols.length;i+=10){
    var batch=symbols.slice(i,i+10);
    await Promise.all(batch.map(async function(sym){
      try{
        var url='https://data-api.binance.vision/api/v3/klines?symbol='+sym+'&interval='+tf+'&limit=70';
        var r=await fetch(url,{mode:'cors'});
        if(!r.ok)throw new Error('http');
        var kdata=await r.json();
        var closes=kdata.map(function(c){return parseFloat(c[4]);});
        var rsi=calcRSI(closes,14);if(rsi===null)return;
        var rsiVals=calcRSIArray(closes,14);
        var price=closes[closes.length-1];
        var rv=Math.round(rsi*10)/10;
        if(rsi>=maxRsi){
          sellSigs.push({sym:sym,rsi:rv,price:price,rsiVals:rsiVals});
          sellSigs.sort(function(a,b){return b.rsi-a.rsi;});
          renderSection(sellSigs,'sellCards','sell');
          document.getElementById('sellSection').style.display='block';
          document.getElementById('nSell').textContent=sellSigs.length;
          document.getElementById('statsArea').style.display='flex';
          addLog('SELL '+sym+' RSI:'+rv);
          playAlert('sell');
          sendNotif('VENTA RSI '+rv,sym+' @ $'+price.toFixed(4));
        }else if(rsi<=minRsi){
          buySigs.push({sym:sym,rsi:rv,price:price,rsiVals:rsiVals});
          buySigs.sort(function(a,b){return a.rsi-b.rsi;});
          renderSection(buySigs,'buyCards','buy');
          document.getElementById('buySection').style.display='block';
          document.getElementById('nBuy').textContent=buySigs.length;
          document.getElementById('statsArea').style.display='flex';
          addLog('BUY  '+sym+' RSI:'+rv);
          playAlert('buy');
          sendNotif('COMPRA RSI '+rv,sym+' @ $'+price.toFixed(4));
        }
      }catch(e){errors++;}
      done++;
      document.getElementById('nScanned').textContent=done;
      document.getElementById('progFill').style.width=Math.round(done/symbols.length*100)+'%';
      document.getElementById('progTxt').innerHTML='<span class="pdot"></span>'+done+'/'+symbols.length+' · '+sellSigs.length+' V · '+buySigs.length+' C';
    }));
    await new Promise(function(r){setTimeout(r,50);});
  }
  document.getElementById('progArea').style.display='none';
  document.getElementById('logbox').style.display='none';
  document.getElementById('statsArea').style.display='flex';
  if(!sellSigs.length&&!buySigs.length)document.getElementById('emptyMsg').style.display='block';
  document.getElementById('updateTxt').textContent='ACTUALIZADO: '+new Date().toLocaleTimeString('es-ES')+' · '+done+' PARES'+(errors>0?' · '+errors+' ERR':'');
  running=false;startCD(CD);
}

async function runWatch(){

      var now=new Date().toLocaleTimeString('es-ES');
      document.getElementById('watchStatus').textContent='WATCH: '+watchSym.toUpperCase()+' RSI '+rsi.toFixed(1)+' · '+now;

        document.getElementById('watchAlert').style.display='block';
      }
      if(rsi<80&&watchAlerted){watchAlerted=false;document.getElementById('watchAlert').style.display='none';}
    }
  }catch(e){}

    var tick=setInterval(function(){
      sec--;if(!watchActive){clearInterval(tick);return;}
      document.getElementById('watchStatus').textContent='WATCH: '+watchSym.toUpperCase()+' · PROX: '+sec+'s';
      if(sec<=0)clearInterval(tick);
    },1000);
    watchTimer=setTimeout(runWatch,45000);
  }
}

document.addEventListener('DOMContentLoaded',function(){
  var inp=document.getElementById('searchSym');
  if(inp)inp.addEventListener('keydown',function(e){if(e.key==='Enter')searchToken();});
});

window.onload=function(){
  if('Notification' in window&&Notification.permission==='default') Notification.requestPermission();
  scan();
};
</script>
