<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSI Scanner - Cripto</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #0a0a1f; color: #fff; padding: 20px; }
    h1 { text-align: center; color: #00ffaa; margin-bottom: 6px; }
    .sub { text-align: center; color: #aaa; font-size: 13px; margin-bottom: 18px; }
    .ctrl { text-align: center; margin-bottom: 14px; }
    .ctrl label { color: #aaa; font-size: 13px; margin-right: 6px; }
    .ctrl select { background: #1a1a2e; color: #fff; border: 1px solid #333; border-radius: 6px; padding: 5px 10px; font-size: 13px; margin-right: 12px; }
    .btn { padding: 11px 28px; font-size: 16px; background: #00ffaa; color: #000; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .btn:disabled { background: #007755; color: #aaa; cursor: not-allowed; }
    .prog { max-width: 600px; margin: 12px auto; }
    .prog-txt { text-align: center; color: #aaa; font-size: 12px; margin-bottom: 5px; }
    .prog-bg { height: 5px; background: #1a1a2e; border-radius: 3px; overflow: hidden; }
    .prog-fill { height: 5px; background: #00ffaa; border-radius: 3px; transition: width 0.2s; }
    .stats { display: flex; gap: 12px; justify-content: center; margin: 14px 0; }
    .stat { background: #1a1a2e; border-radius: 8px; padding: 10px 20px; text-align: center; }
    .stat .n { font-size: 24px; font-weight: bold; color: #00ffaa; }
    .stat.red .n { color: #ff4444; }
    .stat .l { font-size: 11px; color: #aaa; margin-top: 2px; }
    .cards { display: flex; flex-direction: column; gap: 8px; max-width: 900px; margin: 0 auto; }
    .card { background: #1a0000; border: 1px solid #660000; border-left: 4px solid #ff4444; border-radius: 8px; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; }
    .card .sym { font-size: 15px; font-weight: bold; }
    .card .price { font-size: 13px; color: #aaa; margin-top: 3px; }
    .card .rsi-n { font-size: 26px; font-weight: bold; color: #ff4444; }
    .card .rsi-lbl { font-size: 11px; color: #aaa; text-align: right; }
    .badge { display: inline-block; background: #8B0000; color: #ffaaaa; font-size: 11px; font-weight: bold; padding: 2px 10px; border-radius: 99px; margin-top: 5px; }
    .empty { text-align: center; padding: 30px; color: #555; font-size: 14px; border: 1px solid #222; border-radius: 8px; }
    .logbox { background: #0d0d1a; border: 1px solid #222; border-radius: 8px; padding: 12px; max-width: 900px; margin: 10px auto; font-size: 11px; color: #666; font-family: monospace; min-height: 36px; max-height: 100px; overflow-y: auto; white-space: pre-wrap; }
    .update { text-align: center; color: #555; font-size: 12px; margin-top: 14px; }
  </style>
</head>
<body>
  <h1>🔍 RSI Scanner — Cripto Completo</h1>
  <p class="sub" id="subTxt">Todos los tokens • Solo RSI alto • Datos reales</p>

  <div class="ctrl">
    <label>Timeframe:</label>
    <select id="tf">
      <option value="1h" selected>1 hora</option>
      <option value="15m">15 min</option>
      <option value="4h">4 horas</option>
      <option value="1d">1 día</option>
    </select>
    <label>RSI mínimo:</label>
    <select id="minRsi">
      <option value="70">≥ 70</option>
      <option value="75">≥ 75</option>
      <option value="80" selected>≥ 80</option>
      <option value="85">≥ 85</option>
    </select>
    <button class="btn" id="btn" onclick="scan()">🚀 Escanear</button>
  </div>

  <div id="progArea" style="display:none" class="prog">
    <div class="prog-txt" id="progTxt">Iniciando...</div>
    <div class="prog-bg"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  </div>

  <div class="logbox" id="logbox" style="display:none"></div>

  <div id="statsArea" style="display:none" class="stats">
    <div class="stat"><div class="n" id="nScanned">0</div><div class="l">escaneados</div></div>
    <div class="stat red"><div class="n" id="nSignals">0</div><div class="l">señales RSI alto</div></div>
  </div>

  <div class="cards" id="results">
    <div class="empty">Presiona <strong>Escanear</strong> para buscar tokens con RSI extremo</div>
  </div>
  <div class="update" id="updateTxt"></div>

<script>
let running = false;

function addLog(msg) {
  const b = document.getElementById('logbox');
  b.style.display = 'block';
  b.textContent += msg + '\n';
  b.scrollTop = b.scrollHeight;
}

function calcRSI(closes, period) {
  if (closes.length < period + 2) return null;
  let g = 0, l = 0;
  for (let i = 1; i <= period; i++) {
    const d = closes[i] - closes[i-1];
    if (d > 0) g += d; else l -= d;
  }
  let ag = g / period, al = l / period;
  for (let i = period + 1; i < closes.length; i++) {
    const d = closes[i] - closes[i-1];
    ag = (ag * (period-1) + (d > 0 ? d : 0)) / period;
    al = (al * (period-1) + (d < 0 ? -d : 0)) / period;
  }
  if (al === 0) return 100;
  return 100 - 100 / (1 + ag / al);
}

function renderCards(signals) {
  const el = document.getElementById('results');
  if (!signals.length) {
    el.innerHTML = '<div class="empty">Sin tokens con RSI en zona extrema ahora mismo 📊</div>';
    return;
  }
  el.innerHTML = signals.map(({sym, rsi, price}) => {
    const p = price >= 1
      ? price.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:4})
      : price.toFixed(6);
    const label = rsi >= 90 ? 'EXTREMO 🔥' : rsi >= 85 ? 'MUY ALTO' : 'SOBRECOMPRADO';
    return `<div class="card">
      <div>
        <div class="sym">${sym.replace('USDT','')} <span style="font-weight:normal;color:#555;font-size:12px">/USDT</span></div>
        <div class="price">$${p}</div>
        <span class="badge">🔴 ${label}</span>
      </div>
      <div style="text-align:right">
        <div class="rsi-n">${rsi.toFixed(1)}</div>
        <div class="rsi-lbl">RSI 14</div>
      </div>
    </div>`;
  }).join('');
}

async function scan() {
  if (running) return;
  running = true;

  const tf = document.getElementById('tf').value;
  const minRsi = parseInt(document.getElementById('minRsi').value);
  const tfLabel = {'15m':'15 min','1h':'1 hora','4h':'4 horas','1d':'1 día'}[tf];
  const btn = document.getElementById('btn');

  btn.disabled = true;
  btn.textContent = '⏳ Escaneando...';
  document.getElementById('progArea').style.display = 'block';
  document.getElementById('statsArea').style.display = 'none';
  document.getElementById('logbox').textContent = '';
  document.getElementById('logbox').style.display = 'block';
  document.getElementById('results').innerHTML = '';
  document.getElementById('updateTxt').textContent = '';
  document.getElementById('subTxt').textContent = `Todos los tokens • Solo RSI ≥ ${minRsi} • ${tfLabel}`;

  // PASO 1: obtener todos los símbolos USDT con volumen alto
  addLog('📡 Obteniendo lista de todos los pares USDT...');
  let symbols = [];
  try {
    const res = await fetch('https://api.binance.com/api/v3/ticker/24hr');
    const data = await res.json();
    symbols = data
      .filter(t => t.symbol.endsWith('USDT') && parseFloat(t.quoteVolume) > 3000000)
      .sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume))
      .map(t => t.symbol);
    addLog(`✅ ${symbols.length} pares con volumen > $3M encontrados`);
  } catch(e) {
    addLog('❌ Error: ' + e.message);
    btn.disabled = false;
    btn.textContent = '🚀 Escanear';
    running = false;
    return;
  }

  // PASO 2: calcular RSI para cada uno
  addLog(`🔍 Calculando RSI(14) en ${tfLabel}...`);
  let done = 0, signals = [], errors = 0;

  for (let i = 0; i < symbols.length; i += 10) {
    const batch = symbols.slice(i, i + 10);

    await Promise.all(batch.map(async sym => {
      try {
        const url = `https://api.binance.com/api/v3/klines?symbol=${sym}&interval=${tf}&limit=60`;
        const res = await fetch(url, { signal: AbortSignal.timeout(5000) });
        if (!res.ok) throw new Error('http ' + res.status);
        const data = await res.json();
        const closes = data.map(c => parseFloat(c[4]));
        const rsi = calcRSI(closes, 14);
        if (rsi !== null && rsi >= minRsi) {
          const price = closes[closes.length - 1];
          signals.push({ sym, rsi: Math.round(rsi * 10) / 10, price });
          signals.sort((a, b) => b.rsi - a.rsi);
          renderCards(signals);
          document.getElementById('nSignals').textContent = signals.length;
          document.getElementById('statsArea').style.display = 'flex';
          addLog(`🔴 ${sym} RSI: ${rsi.toFixed(1)}`);
        }
      } catch(e) {
        errors++;
      }
      done++;
      const pct = Math.round(done / symbols.length * 100);
      document.getElementById('progFill').style.width = pct + '%';
      document.getElementById('progTxt').textContent = `${done}/${symbols.length} pares... (${signals.length} señales encontradas)`;
      document.getElementById('nScanned').textContent = done;
    }));

    await new Promise(r => setTimeout(r, 50));
  }

  // FINALIZAR
  document.getElementById('progArea').style.display = 'none';
  document.getElementById('logbox').style.display = 'none';
  document.getElementById('statsArea').style.display = 'flex';
  if (!signals.length) renderCards([]);

  const now = new Date().toLocaleTimeString('es-ES');
  document.getElementById('updateTxt').textContent =
    `Actualizado: ${now} • ${done} pares escaneados • RSI(14) en ${tfLabel}` +
    (errors > 0 ? ` • ${errors} errores` : '');

  btn.disabled = false;
  btn.textContent = '🚀 Escanear';
  running = false;
}
</script>
</body>
</html>
