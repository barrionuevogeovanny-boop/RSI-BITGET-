<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSI Scanner - Bitget</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0a0a1f;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #00ffaa;
      margin-bottom: 5px;
    }
    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
    }
    button {
      display: block;
      margin: 15px auto;
      padding: 12px 28px;
      font-size: 17px;
      background: #00ffaa;
      color: black;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .signals {
      max-width: 1100px;
      margin: 20px auto;
    }
    .signal-card {
      padding: 12px 18px;
      margin: 8px 0;
      border-radius: 8px;
      font-weight: bold;
      font-size: 18px;
    }
    .strong-sell { background: #8B0000; color: white; }
    .strong-buy { background: #006400; color: white; }

    table {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      border-collapse: collapse;
      background: #1a1a2e;
    }
    th, td {
      padding: 14px;
      text-align: center;
    }
    th {
      background: #16213e;
      color: #00ffaa;
    }
    .oversold { background: #004d00 !important; color: #00ff88; }
    .overbought { background: #660000 !important; color: #ff7777; }
    .neutral { background: #1f1f3a; }

    .last-update {
      text-align: center;
      color: #888;
      margin: 15px 0;
    }
  </style>
</head>
<body>
  <h1>🔍 RSI Scanner - Bitget</h1>
  <p class="subtitle">RSI (14 períodos) • Timeframe 15 minutos • Datos de prueba</p>

  <button onclick="calcularRSI()">🔄 Actualizar Manualmente</button>

  <div class="signals" id="strongSignals"></div>

  <div class="last-update" id="lastUpdate">Última actualización: Cargando...</div>

  <table id="rsiTable">
    <thead>
      <tr>
        <th>Token</th>
        <th>Precio</th>
        <th>RSI (14)</th>
        <th>Señal</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <script>
    const tokens = [
      "BTCUSDT", "ETHUSDT", "SOLUSDT", "DOGEUSDT", "XRPUSDT",
      "BNBUSDT", "ADAUSDT", "AVAXUSDT", "TONUSDT", "SHIBUSDT",
      "LINKUSDT", "DOTUSDT", "NEARUSDT", "SUIUSDT", "OPUSDT"
    ];

    function calcularRSI() {
      const tbody = document.getElementById("tableBody");
      const signalsDiv = document.getElementById("strongSignals");
      tbody.innerHTML = "";
      signalsDiv.innerHTML = "";

      let strongSignals = [];

      tokens.forEach(symbol => {
        const rsi = Math.floor(Math.random() * 75) + 12; // Entre 12 y 86
        const precio = (Math.random() * 2500 + 0.05).toFixed(4);

        let clase = "neutral";
        let señal = "Neutral";
        let señalColor = "";

        if (rsi <= 20) {
          clase = "oversold";
          señal = "🟢 MUY SOBREVENDIDO";
          señalColor = "strong-buy";
          strongSignals.push({symbol, rsi, tipo: "buy", precio});
        } 
        else if (rsi >= 80) {
          clase = "overbought";
          señal = "🔴 MUY SOBRECOMPRADO";
          señalColor = "strong-sell";
          strongSignals.push({symbol, rsi, tipo: "sell", precio});
        } 
        else if (rsi <= 30) {
          clase = "oversold";
          señal = "🟢 Posible Compra";
        } 
        else if (rsi >= 70) {
          clase = "overbought";
          señal = "🔴 Posible Venta";
        }

        // Fila normal
        const fila = `
          <tr class="${clase}">
            <td><strong>${symbol}</strong></td>
            <td>$${parseFloat(precio).toLocaleString()}</td>
            <td><strong>${rsi}</strong></td>
            <td>${señal}</td>
          </tr>
        `;
        tbody.innerHTML += fila;
      });

      // Mostrar señales fuertes arriba
      if (strongSignals.length > 0) {
        strongSignals.forEach(item => {
          const card = document.createElement("div");
          card.className = `signal-card ${item.tipo === "sell" ? "strong-sell" : "strong-buy"}`;
          card.innerHTML = `${item.symbol} → RSI ${item.rsi} → ${item.tipo === "sell" ? "🔴 MUY SOBRECOMPRADO (Posible Venta)" : "🟢 MUY SOBREVENDIDO (Posible Compra)"}`;
          signalsDiv.appendChild(card);
        });
      } else {
        signalsDiv.innerHTML = `<p style="text-align:center; color:#666;">No hay señales extremas en este momento (RSI <20 o >80)</p>`;
      }

      document.getElementById("lastUpdate").innerHTML = 
        `Última actualización: ${new Date().toLocaleTimeString('es-ES')} (datos de prueba)`;
    }

    // Actualización automática cada 25 segundos
    setInterval(calcularRSI, 25000);

    // Cargar al abrir la página
    window.onload = calcularRSI;
  </script>
</body>
</html>
