<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSI Scanner - Bitget</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0a0a1f; color: #fff; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #00ffaa; }
    .subtitle { text-align: center; color: #aaa; margin-bottom: 20px; }
    button { display: block; margin: 15px auto; padding: 12px 30px; font-size: 17px; background: #00ffaa; color: black; border: none; border-radius: 8px; cursor: pointer; }
    .signals { max-width: 1100px; margin: 20px auto; }
    .signal-card { padding: 15px; margin: 10px 0; border-radius: 8px; font-weight: bold; font-size: 17px; }
    .strong-sell { background: #8B0000; }
    .strong-buy { background: #006400; }
    table { width: 100%; max-width: 1100px; margin: 0 auto; border-collapse: collapse; background: #1a1a2e; }
    th, td { padding: 14px; text-align: center; border-bottom: 1px solid #333; }
    th { background: #16213e; color: #00ffaa; }
    .oversold { background: #004d00 !important; color: #00ff88; }
    .overbought { background: #660000 !important; color: #ff7777; }
    .last-update { text-align: center; color: #888; margin: 15px 0; }
    .error { color: #ffaaaa; text-align: center; }
  </style>
</head>
<body>
  <h1>🔍 RSI Scanner - Cripto</h1>
  <p class="subtitle">Precios reales (Binance) • RSI simulado • 15 minutos</p>

  <button onclick="cargarDatos()">🔄 Actualizar Datos Reales</button>

  <div class="signals" id="strongSignals"></div>
  <div class="last-update" id="lastUpdate">Cargando precios reales...</div>

  <table id="rsiTable">
    <thead>
      <tr>
        <th>Token</th>
        <th>Precio Actual</th>
        <th>RSI (14)</th>
        <th>Señal</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <script>
    const tokens = ["BTCUSDT","ETHUSDT","SOLUSDT","DOGEUSDT","XRPUSDT","BNBUSDT","ADAUSDT","AVAXUSDT","TONUSDT","SHIBUSDT","LINKUSDT","DOTUSDT","NEARUSDT","SUIUSDT","OPUSDT"];

    async function cargarDatos() {
      const tbody = document.getElementById("tableBody");
      const signalsDiv = document.getElementById("strongSignals");
      tbody.innerHTML = "";
      signalsDiv.innerHTML = "<p style='text-align:center;color:#aaa;'>Cargando precios de Binance...</p>";

      let strong = [];

      for (let symbol of tokens) {
        try {
          // Nuevo proxy más estable
          const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(`https://api.binance.com/api/v3/ticker/price?symbol=${symbol}`)}`;
          
          const res = await fetch(proxyUrl);
          if (!res.ok) throw new Error("Error fetch");

          const data = await res.json();
          const precio = parseFloat(data.price).toLocaleString('en-US');

          const rsi = Math.floor(Math.random() * 78) + 12; // RSI simulado

          let clase = "";
          let señal = "Neutral";

          if (rsi <= 20) {
            clase = "oversold";
            señal = "🟢 MUY SOBREVENDIDO";
            strong.push(`<div class="signal-card strong-buy">${symbol} → RSI ${rsi} → 🟢 MUY SOBREVENDIDO (Posible Compra Fuerte)</div>`);
          } else if (rsi >= 80) {
            clase = "overbought";
            señal = "🔴 MUY SOBRECOMPRADO";
            strong.push(`<div class="signal-card strong-sell">${symbol} → RSI ${rsi} → 🔴 MUY SOBRECOMPRADO (Posible Venta Fuerte)</div>`);
          } else if (rsi <= 30) {
            clase = "oversold";
            señal = "🟢 Posible Compra";
          } else if (rsi >= 70) {
            clase = "overbought";
            señal = "🔴 Posible Venta";
          }

          tbody.innerHTML += `
            <tr class="${clase}">
              <td><strong>${symbol}</strong></td>
              <td>$${precio}</td>
              <td><strong>${rsi}</strong></td>
              <td>${señal}</td>
            </tr>`;
        } catch(e) {
          tbody.innerHTML += `<tr><td>${symbol}</td><td class="error">Error</td><td>-</td><td>Proxy falló</td></tr>`;
        }
      }

      if (strong.length > 0) {
        signalsDiv.innerHTML = strong.join("");
      } else {
        signalsDiv.innerHTML = `<p style="color:#555;text-align:center;">No hay señales extremas (RSI <20 o >80) en este momento</p>`;
      }

      document.getElementById("lastUpdate").innerHTML = `Última actualización: ${new Date().toLocaleTimeString('es-ES')} (precios vía proxy)`;
    }

    // Cargar automáticamente
    window.onload = cargarDatos;
    setInterval(cargarDatos, 45000); // cada 45 segundos
  </script>
</body>
</html>
