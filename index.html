<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSI SCANNER - CRIPTO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #050510;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* VIDEO FONDO */
    #video-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 0.55;
    }

    /* Overlay oscuro sobre el video */
    #overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(2, 4, 18, 0.62);
      z-index: 1;
      pointer-events: none;
    }

    #app {
      position: relative;
      z-index: 2;
      padding: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #00ffcc;
      text-shadow: 0 0 24px #00ffccaa, 0 0 50px #00ffcc44;
      margin-bottom: 4px;
    }

    .sub {
      text-align: center;
      color: #88ffdd;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
      text-shadow: 0 0 8px #00ffcc66;
    }

    .ctrl {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin-bottom: 12px;
      background: rgba(0,10,20,0.7);
      border: 1px solid #00ffcc33;
      border-radius: 12px;
      padding: 12px 20px;
      backdrop-filter: blur(14px);
    }
    .ctrl label { color: #88ffdd; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
    .ctrl select {
      background: rgba(0,20,30,0.85);
      color: #00ffcc;
      border: 1px solid #00ffcc44;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
    }

    .countdown-wrap { text-align: center; margin-bottom: 10px; }
    .countdown {
      display: inline-block;
      font-size: 13px;
      font-family: monospace;
      color: #050510;
      background: #00ffcc;
      padding: 4px 20px;
      border-radius: 99px;
      font-weight: bold;
      letter-spacing: 2px;
      box-shadow: 0 0 16px #00ffccaa;
    }

    .prog { max-width: 700px; margin: 10px auto; }
    .prog-txt {
      text-align: center;
      color: #00ffcc;
      font-size: 12px;
      margin-bottom: 5px;
      font-family: monospace;
      letter-spacing: 1px;
    }
    .prog-bg { height: 4px; background: #0a1a15; border-radius: 3px; overflow: hidden; }
    .prog-fill {
      height: 4px; border-radius: 3px; transition: width 0.2s;
      background: linear-gradient(90deg, #00ffcc, #0088ff, #aa00ff);
      box-shadow: 0 0 8px #00ffcc88;
    }

    .stats { display: flex; gap: 12px; justify-content: center; margin: 12px 0; flex-wrap: wrap; }
    .stat {
      background: rgba(0,0,0,0.6);
      border: 1px solid #00ffcc22;
      border-radius: 10px;
      padding: 10px 22px;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    .stat .n { font-size: 26px; font-weight: bold; text-shadow: 0 0 10px currentColor; }
    .stat .l { font-size: 10px; color: #aaa; margin-top: 2px; letter-spacing: 1px; text-transform: uppercase; }
    .stat.cyan .n { color: #00ffcc; }
    .stat.red .n  { color: #ff4455; }
    .stat.green .n { color: #00ff88; }

    .section-title {
      text-align: center;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 12px 0 10px;
    }
    .section-title.sell { color: #ff4455; text-shadow: 0 0 14px #ff445588; }
    .section-title.buy  { color: #00ff88; text-shadow: 0 0 14px #00ff8888; }

    .cards { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }

    /* CARD — layout vertical con barra RSI abajo */
    .card {
      border-radius: 10px;
      padding: 14px 18px 12px;
      backdrop-filter: blur(12px);
      animation: fadeSlide 0.35s ease;
    }
    @keyframes fadeSlide {
      from { opacity:0; transform: translateX(-8px); }
      to   { opacity:1; transform: none; }
    }
    .card.sell {
      background: rgba(100,0,15,0.38);
      border: 1px solid #ff445544;
      border-left: 3px solid #ff4455;
    }
    .card.buy {
      background: rgba(0,80,40,0.35);
      border: 1px solid #00ff8844;
      border-left: 3px solid #00ff88;
    }

    /* Top row: info + RSI número */
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .card-left { flex: 1; }
    .sym {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .card.sell .sym { color: #ffcccc; }
    .card.buy  .sym { color: #ccffee; }
    .sym span { font-weight: 400; color: #555; font-size: 12px; }

    /* PRECIO — destacado */
    .price {
      font-size: 18px;
      font-weight: 700;
      margin-top: 3px;
      letter-spacing: 1px;
    }
    .card.sell .price { color: #ffaaaa; text-shadow: 0 0 8px #ff445566; }
    .card.buy  .price { color: #aaffcc; text-shadow: 0 0 8px #00ff8866; }

    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 99px;
      margin-top: 5px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .badge.sell { background: rgba(255,68,85,0.2); color: #ff8899; border: 1px solid #ff445566; }
    .badge.buy  { background: rgba(0,255,136,0.15); color: #88ffcc; border: 1px solid #00ff8866; }

    /* RSI NÚMERO */
    .rsi-block { text-align: right; min-width: 80px; }
    .rsi-n { font-size: 36px; font-weight: 900; text-shadow: 0 0 14px currentColor; line-height: 1; }
    .card.sell .rsi-n { color: #ff4455; }
    .card.buy  .rsi-n { color: #00ff88; }
    .rsi-lbl { font-size: 10px; color: #666; letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }

    /* BARRA RSI — ocupa casi todo el ancho */
    .rsi-bar-wrap {
      width: 100%;
      margin-top: 4px;
    }
    .rsi-bar-track {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.07);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }
    .rsi-bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.6s ease;
      position: relative;
    }
    .card.sell .rsi-bar-fill {
      background: linear-gradient(90deg, #ff220033, #ff4455, #ff8800);
      box-shadow: 0 0 8px #ff445588;
    }
    .card.buy .rsi-bar-fill {
      background: linear-gradient(90deg, #00440022, #00ff88, #00ffcc);
      box-shadow: 0 0 8px #00ff8888;
    }
    .rsi-bar-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 3px;
      font-size: 9px;
      color: #444;
      font-family: monospace;
      letter-spacing: 1px;
    }

    .empty {
      text-align: center; padding: 24px; color: #444; font-size: 14px;
      border: 1px solid #0f1f1a; border-radius: 10px;
      background: rgba(0,0,0,0.3); letter-spacing: 1px;
    }
    .logbox {
      background: rgba(0,0,0,0.75); border: 1px solid #00ffcc11; border-radius: 8px;
      padding: 10px; max-width: 700px; margin: 8px auto;
      font-size: 11px; color: #00ffcc66; font-family: monospace;
      max-height: 80px; overflow-y: auto; white-space: pre-wrap;
    }
    .update { text-align: center; color: #333; font-size: 11px; margin-top: 10px; padding-bottom: 30px; letter-spacing: 1px; }
    .pulse {
      display: inline-block; width: 7px; height: 7px;
      background: #00ffcc; border-radius: 50%;
      margin-right: 5px; vertical-align: middle;
      box-shadow: 0 0 6px #00ffcc; animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50% { opacity:0.3; transform:scale(0.6); }
    }
  </style>
</head>
<body>

<!-- VIDEO FONDO -->
<video id="video-bg" autoplay muted loop playsinline>
  <source src="327171_medium.mp4" type="video/mp4">
</video>
<div id="overlay"></div>

<div id="app">
  <h1>RSI SCANNER — CRIPTO</h1>
  <p class="sub" id="subTxt">TODOS LOS TOKENS &bull; SEÑALES RSI EXTREMAS &bull; AUTO-REFRESH</p>

  <div class="ctrl">
    <label>Timeframe:</label>
    <select id="tf">
      <option value="1h" selected>1 HORA</option>
      <option value="15m">15 MIN</option>
      <option value="4h">4 HORAS</option>
      <option value="1d">1 DÍA</option>
    </select>
    <label>RSI venta ≥:</label>
    <select id="maxRsi">
      <option value="70">70</option>
      <option value="75">75</option>
      <option value="80" selected>80</option>
      <option value="85">85</option>
    </select>
    <label>RSI compra ≤:</label>
    <select id="minRsi">
      <option value="25" selected>25</option>
      <option value="20">20</option>
      <option value="15">15</option>
      <option value="10">10</option>
    </select>
    <label>Vol mín:</label>
    <select id="volMin">
      <option value="1">$1M</option>
      <option value="3" selected>$3M</option>
      <option value="5">$5M</option>
      <option value="10">$10M</option>
    </select>
  </div>

  <div class="countdown-wrap">
    <span class="countdown" id="countdown">INICIANDO ESCANEO...</span>
  </div>

  <div id="progArea" style="display:none" class="prog">
    <div class="prog-txt" id="progTxt"><span class="pulse"></span>INICIANDO...</div>
    <div class="prog-bg"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  </div>

  <div class="logbox" id="logbox" style="display:none"></div>

  <div id="statsArea" style="display:none" class="stats">
    <div class="stat cyan"><div class="n" id="nScanned">0</div><div class="l">escaneados</div></div>
    <div class="stat red"><div class="n" id="nSell">0</div><div class="l">🔴 venta</div></div>
    <div class="stat green"><div class="n" id="nBuy">0</div><div class="l">🟢 compra</div></div>
  </div>

  <div id="sellSection" style="display:none">
    <div class="section-title sell">🔴 SOBRECOMPRADOS — POSIBLE VENTA / SHORT</div>
    <div class="cards" id="sellCards"></div>
  </div>

  <div id="buySection" style="display:none">
    <div class="section-title buy">🟢 SOBREVENDIDOS — POSIBLE COMPRA / LONG</div>
    <div class="cards" id="buyCards"></div>
  </div>

  <div id="emptyMsg" class="empty" style="display:none">SIN SEÑALES EXTREMAS EN ESTE MOMENTO 📊</div>
  <div class="update" id="updateTxt"></div>
</div>

<script>
let running = false;
let countdownTimer = null;

function addLog(msg) {
  const b = document.getElementById('logbox');
  b.style.display = 'block';
  b.textContent += msg + '\n';
  b.scrollTop = b.scrollHeight;
}

function calcRSI(closes, period) {
  if (closes.length < period + 2) return null;
  let g = 0, l = 0;
  for (let i = 1; i <= period; i++) {
    const d = closes[i] - closes[i-1];
    if (d > 0) g += d; else l -= d;
  }
  let ag = g/period, al = l/period;
  for (let i = period+1; i < closes.length; i++) {
    const d = closes[i] - closes[i-1];
    ag = (ag*(period-1) + (d>0?d:0)) / period;
    al = (al*(period-1) + (d<0?-d:0)) / period;
  }
  if (al === 0) return 100;
  return 100 - 100/(1 + ag/al);
}

function rsiLabel(rsi, type) {
  if (type === 'sell') {
    if (rsi >= 90) return 'EXTREMO 🔥';
    if (rsi >= 85) return 'MUY ALTO';
    return 'SOBRECOMPRADO';
  } else {
    if (rsi <= 10) return 'EXTREMO 💎';
    if (rsi <= 15) return 'MUY BAJO';
    return 'SOBREVENDIDO';
  }
}

function buildCard(sym, rsi, price, type) {
  const p = price >= 1
    ? price.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 4})
    : price.toFixed(6);
  const barW = Math.min(100, Math.max(0, rsi)).toFixed(1);
  return `<div class="card ${type}">
    <div class="card-top">
      <div class="card-left">
        <div class="sym">${sym.replace('USDT','')} <span>/USDT</span></div>
        <div class="price">$${p}</div>
        <span class="badge ${type}">${type==='sell'?'🔴':'🟢'} ${rsiLabel(rsi,type)}</span>
      </div>
      <div class="rsi-block">
        <div class="rsi-n">${rsi.toFixed(1)}</div>
        <div class="rsi-lbl">RSI 14</div>
      </div>
    </div>
    <div class="rsi-bar-wrap">
      <div class="rsi-bar-track">
        <div class="rsi-bar-fill" style="width:${barW}%"></div>
      </div>
      <div class="rsi-bar-labels">
        <span>0</span><span>25</span><span>50</span><span>75</span><span>100</span>
      </div>
    </div>
  </div>`;
}

function renderSection(signals, type) {
  document.getElementById(type+'Cards').innerHTML =
    signals.map(s => buildCard(s.sym, s.rsi, s.price, type)).join('');
}

function startCountdown(seconds) {
  if (countdownTimer) clearInterval(countdownTimer);
  let val = seconds;
  const el = document.getElementById('countdown');
  countdownTimer = setInterval(() => {
    val--;
    if (val <= 0) {
      clearInterval(countdownTimer);
      el.textContent = 'ESCANEANDO AHORA...';
      scan();
    } else {
      el.textContent = `PRÓXIMO ESCANEO EN: ${val}S`;
    }
  }, 1000);
}

async function scan() {
  if (running) return;
  running = true;
  if (countdownTimer) clearInterval(countdownTimer);
  document.getElementById('countdown').textContent = 'ESCANEANDO...';

  const tf = document.getElementById('tf').value;
  const maxRsi = parseInt(document.getElementById('maxRsi').value);
  const minRsi = parseInt(document.getElementById('minRsi').value);
  const volMin = parseFloat(document.getElementById('volMin').value) * 1e6;
  const tfLabel = {'15m':'15 MIN','1h':'1 HORA','4h':'4 HORAS','1d':'1 DÍA'}[tf];

  document.getElementById('subTxt').textContent =
    `TODOS LOS TOKENS • RSI ≥${maxRsi} VENTA / ≤${minRsi} COMPRA • ${tfLabel}`;
  document.getElementById('progArea').style.display = 'block';
  document.getElementById('statsArea').style.display = 'none';
  document.getElementById('sellSection').style.display = 'none';
  document.getElementById('buySection').style.display = 'none';
  document.getElementById('emptyMsg').style.display = 'none';
  document.getElementById('logbox').textContent = '';
  document.getElementById('logbox').style.display = 'block';
  document.getElementById('progFill').style.width = '0%';

  addLog('OBTENIENDO PARES USDT...');
  let symbols = [];
  try {
    const res = await fetch('https://api.binance.com/api/v3/ticker/24hr');
    const data = await res.json();
    symbols = data
      .filter(t => t.symbol.endsWith('USDT') && parseFloat(t.quoteVolume) > volMin)
      .sort((a,b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume))
      .map(t => t.symbol);
    addLog(`${symbols.length} PARES CON VOLUMEN > $${volMin/1e6}M`);
  } catch(e) {
    addLog('ERROR: ' + e.message);
    running = false;
    startCountdown(25);
    return;
  }

  let done = 0, sellSignals = [], buySignals = [], errors = 0;

  for (let i = 0; i < symbols.length; i += 10) {
    const batch = symbols.slice(i, i+10);
    await Promise.all(batch.map(async sym => {
      try {
        const url = `https://api.binance.com/api/v3/klines?symbol=${sym}&interval=${tf}&limit=60`;
        const res = await fetch(url, { signal: AbortSignal.timeout(5000) });
        if (!res.ok) throw new Error('http');
        const data = await res.json();
        const closes = data.map(c => parseFloat(c[4]));
        const rsi = calcRSI(closes, 14);
        if (rsi === null) return;
        const price = closes[closes.length-1];
        const r = Math.round(rsi*10)/10;

        if (rsi >= maxRsi) {
          const idx = sellSignals.findIndex(s => s.sym === sym);
          if (idx >= 0) sellSignals[idx] = {sym,rsi:r,price};
          else sellSignals.push({sym,rsi:r,price});
          sellSignals.sort((a,b) => b.rsi - a.rsi);
          renderSection(sellSignals, 'sell');
          document.getElementById('sellSection').style.display = 'block';
          document.getElementById('nSell').textContent = sellSignals.length;
          document.getElementById('statsArea').style.display = 'flex';
          addLog(`🔴 ${sym} RSI: ${r}`);
        } else if (rsi <= minRsi) {
          const idx = buySignals.findIndex(s => s.sym === sym);
          if (idx >= 0) buySignals[idx] = {sym,rsi:r,price};
          else buySignals.push({sym,rsi:r,price});
          buySignals.sort((a,b) => a.rsi - b.rsi);
          renderSection(buySignals, 'buy');
          document.getElementById('buySection').style.display = 'block';
          document.getElementById('nBuy').textContent = buySignals.length;
          document.getElementById('statsArea').style.display = 'flex';
          addLog(`🟢 ${sym} RSI: ${r}`);
        }
      } catch(e) { errors++; }

      done++;
      document.getElementById('nScanned').textContent = done;
      document.getElementById('progFill').style.width = Math.round(done/symbols.length*100)+'%';
      document.getElementById('progTxt').innerHTML =
        `<span class="pulse"></span>${done}/${symbols.length} PARES... (${sellSignals.length} VENTAS · ${buySignals.length} COMPRAS)`;
    }));
    await new Promise(r => setTimeout(r, 50));
  }

  document.getElementById('progArea').style.display = 'none';
  document.getElementById('logbox').style.display = 'none';
  document.getElementById('statsArea').style.display = 'flex';
  if (!sellSignals.length && !buySignals.length)
    document.getElementById('emptyMsg').style.display = 'block';

  const now = new Date().toLocaleTimeString('es-ES');
  document.getElementById('updateTxt').textContent =
    `ACTUALIZADO: ${now} • ${done} PARES • RSI(14) EN ${tfLabel}` +
    (errors > 0 ? ` • ${errors} ERRORES` : '');

  running = false;
  startCountdown(25);
}

window.onload = () => scan();
</script>
</body>
</html>
