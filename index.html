<!DOCTYPE html>
<html>
<head>
  <title>RSI Scanner Bitget</title>
</head>
<body>
  <h2>RSI Scanner (Bitget)</h2>
  <div id="result">Cargando datos...</div>

<script>
async function getData(symbol) {
  const url = `https://api.bitget.com/api/v2/spot/market/candles?symbol=${symbol}&granularity=1min&limit=50`;
  const res = await fetch(url);
  const data = await res.json();
  return data.data.map(c => parseFloat(c[4]));
}

// RSI simple
function rsi(prices, period = 14) {
  let gains = 0, losses = 0;

  for (let i = 1; i <= period; i++) {
    let diff = prices[i] - prices[i - 1];
    if (diff >= 0) gains += diff;
    else losses -= diff;
  }

  let avgGain = gains / period;
  let avgLoss = losses / period;

  return 100 - (100 / (1 + avgGain / avgLoss));
}

async function run() {
  const symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT"];
  let html = "";

  for (let s of symbols) {
    try {
      let prices = await getData(s);
      let value = rsi(prices);

      let status = "NEUTRAL ⚪";
      if (value > 70) status = "OVERBOUGHT 🔴";
      if (value < 30) status = "OVERSOLD 🟢";

      html += `<p>${s}: RSI ${value.toFixed(2)} → ${status}</p>`;
    } catch (e) {
      html += `<p>${s}: error</p>`;
    }
  }

  document.getElementById("result").innerHTML = html;
}

run();
setInterval(run, 60000);
</script>
</body>
</html>
